<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>금리 비교 노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* 레이아웃: 상단 기준금리 요약 → 탭(예금·적금·대출·정책대출) → 탭별 필터 + 기준금리 대비 막대 목록 */
:root{
  --paper:#f4f5f1;
  --card:#ffffff;
  --ink:#16223a;
  --muted:#5d6676;
  --line:#dfe2dc;
  --accent:#0e6b6b;
  --accent-soft:#dcefed;
  --mark:#c47a1e;
  --mark-soft:#f7ead6;
  --good:#2d7a3e;
  --bad:#b23b3b;
  --font-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-num:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#11161f;--card:#19202b;--ink:#e7ebf0;--muted:#9aa4b2;--line:#2a3340;
    --accent:#4fb8b0;--accent-soft:#1d3536;--mark:#e3a24f;--mark-soft:#3a2e1d;
    --good:#6cc27f;--bad:#e27a7a;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#11161f;--card:#19202b;--ink:#e7ebf0;--muted:#9aa4b2;--line:#2a3340;
  --accent:#4fb8b0;--accent-soft:#1d3536;--mark:#e3a24f;--mark-soft:#3a2e1d;
  --good:#6cc27f;--bad:#e27a7a;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 48px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-size:22px;font-weight:700;letter-spacing:-.01em}
h2{font-size:17px;font-weight:600}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--mark-soft);color:var(--mark)}
.muted{color:var(--muted)}
.small{font-size:13px}

/* 기준금리 카드 */
.base{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.base .big{font-size:40px;font-weight:600;line-height:1;color:var(--mark)}
.base .lbl{font-size:13px;color:var(--muted);margin-bottom:6px}
.base svg{width:100%;height:96px;display:block}
@media (max-width:520px){.base{grid-template-columns:1fr}}

/* 탭 */
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{appearance:none;border:0;background:none;font:inherit;font-weight:600;color:var(--muted);padding:10px 12px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tab:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.panel{display:flex;flex-direction:column;gap:14px}
.panel[hidden]{display:none}
.controls{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.field input,.field select{font:inherit;font-size:15px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0}
.field input[type="number"]{width:130px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font:inherit;font-size:14px;border:0;background:var(--paper);color:var(--ink);padding:7px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.check{flex-direction:row;align-items:center;gap:6px;color:var(--ink);font-size:14px}

/* 상품 목록 */
.list{display:flex;flex-direction:column;gap:8px}
.row{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:6px 12px}
.row .name{font-weight:600}
.row .bank{font-size:13px;color:var(--muted)}
.row .rate{text-align:right}
.row .rate b{font-size:20px;font-weight:600;color:var(--accent)}
.row .rate .basic{display:block;font-size:12px;color:var(--muted)}
.bar{grid-column:1/-1;position:relative;height:8px;border-radius:4px;background:var(--paper)}
.bar .fill{position:absolute;inset:0 auto 0 0;border-radius:4px;background:var(--accent-soft)}
.bar .fill.max{background:var(--accent)}
.bar .baseline{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--mark)}
.meta{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 10px;font-size:13px;color:var(--muted)}
.pill{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--paper);border:1px solid var(--line);color:var(--ink)}
.pill.gap{background:var(--mark-soft);border-color:transparent;color:var(--mark);font-weight:600}
details{grid-column:1/-1;font-size:13px}
details summary{cursor:pointer;color:var(--accent);font-weight:500}
details ul{margin:6px 0 0;padding-left:18px;color:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:8px;border-radius:2px;vertical-align:middle;margin-right:4px}

/* 정책대출 */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px 14px;width:100%}
.pgrid .field input,.pgrid .field select{width:100%}
.pcard{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--good);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.pcard.no{border-left-color:var(--line);opacity:.78}
.pcard .head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.status{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px}
.status.ok{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.status.ng{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.pcard .rate b{font-size:22px;color:var(--accent);font-weight:600}
.reasons{margin:0;padding-left:18px;font-size:13px;color:var(--muted)}
.calc{background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:14px}
.calc b{font-family:var(--font-num)}
footer{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
@media (prefers-reduced-motion:no-preference){.bar .fill{transition:width .3s}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>금리 비교 노트</h1>
    <span class="chip" id="dataChip">샘플 데이터 · 실제 금리 아님</span>
  </header>

  <section class="base" aria-label="한국은행 기준금리">
    <div>
      <div class="lbl">한국은행 기준금리</div>
      <div class="big num" id="baseNow">2.50%</div>
      <div class="small muted" id="baseInfo"></div>
    </div>
    <svg id="baseChart" viewBox="0 0 520 96" preserveAspectRatio="none" role="img" aria-label="기준금리 추이"></svg>
  </section>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="deposit" aria-selected="true">정기예금</button>
    <button class="tab" role="tab" data-tab="savings" aria-selected="false">적금</button>
    <button class="tab" role="tab" data-tab="loan" aria-selected="false">대출</button>
    <button class="tab" role="tab" data-tab="policy" aria-selected="false">정책대출</button>
  </nav>

  <!-- 정기예금 -->
  <section class="panel" id="panel-deposit">
    <div class="controls">
      <div class="field">기간
        <div class="seg" id="depTerm">
          <button data-v="6" aria-pressed="false">6개월</button>
          <button data-v="12" aria-pressed="true">12개월</button>
          <button data-v="24" aria-pressed="false">24개월</button>
        </div>
      </div>
      <label class="field" for="depAmt">예치금액(만원)
        <input id="depAmt" type="number" min="0" step="100" value="1000">
      </label>
      <label class="field" for="depSort">정렬
        <select id="depSort"><option value="max">최고금리 순</option><option value="basic">기본금리 순</option></select>
      </label>
    </div>
    <div class="legend"><span><i style="background:var(--accent-soft)"></i>기본금리</span><span><i style="background:var(--accent)"></i>우대 포함 최고금리</span><span><i style="background:var(--mark);width:3px"></i>기준금리</span></div>
    <div class="list" id="depList"></div>
  </section>

  <!-- 적금 -->
  <section class="panel" id="panel-savings" hidden>
    <div class="controls">
      <div class="field">기간
        <div class="seg" id="savTerm">
          <button data-v="6" aria-pressed="false">6개월</button>
          <button data-v="12" aria-pressed="true">12개월</button>
          <button data-v="24" aria-pressed="false">24개월</button>
        </div>
      </div>
      <label class="field" for="savAmt">월 납입액(만원)
        <input id="savAmt" type="number" min="0" step="5" value="50">
      </label>
    </div>
    <div class="legend"><span><i style="background:var(--accent-soft)"></i>기본금리</span><span><i style="background:var(--accent)"></i>우대 포함 최고금리</span><span><i style="background:var(--mark);width:3px"></i>기준금리</span></div>
    <div class="list" id="savList"></div>
  </section>

  <!-- 대출 -->
  <section class="panel" id="panel-loan" hidden>
    <div class="controls">
      <div class="field">종류
        <div class="seg" id="loanType">
          <button data-v="mortgage" aria-pressed="true">주택담보</button>
          <button data-v="jeonse" aria-pressed="false">전세자금</button>
          <button data-v="credit" aria-pressed="false">신용</button>
        </div>
      </div>
      <label class="field" for="loanAmt">대출금액(만원)
        <input id="loanAmt" type="number" min="0" step="500" value="20000">
      </label>
      <label class="field" for="loanYears">기간(년)
        <input id="loanYears" type="number" min="1" max="40" value="30">
      </label>
    </div>
    <div class="legend"><span><i style="background:var(--accent-soft)"></i>최저~최고 금리 범위</span><span><i style="background:var(--accent)"></i>전월 평균</span><span><i style="background:var(--mark);width:3px"></i>기준금리</span></div>
    <div class="list" id="loanList"></div>
  </section>

  <!-- 정책대출 -->
  <section class="panel" id="panel-policy" hidden>
    <div class="controls">
      <div class="pgrid">
        <label class="field" for="pPurpose">목적
          <select id="pPurpose"><option value="buy">집 구입</option><option value="jeonse">전세</option></select>
        </label>
        <label class="field" for="pIncome">부부합산 연소득(만원)
          <input id="pIncome" type="number" min="0" step="100" value="7000">
        </label>
        <label class="field" for="pPrice">주택가격·보증금(만원)
          <input id="pPrice" type="number" min="0" step="1000" value="45000">
        </label>
        <label class="field" for="pKids">자녀 수
          <select id="pKids"><option>0</option><option>1</option><option>2</option><option selected>3</option></select>
        </label>
        <label class="field" for="pAge">본인 나이(만)
          <input id="pAge" type="number" min="19" max="80" value="37">
        </label>
        <label class="field" for="pRegion">지역
          <select id="pRegion"><option value="local" selected>비수도권</option><option value="metro">수도권</option></select>
        </label>
      </div>
      <label class="field check" for="pHomeless"><input id="pHomeless" type="checkbox" checked>무주택 세대주</label>
      <label class="field check" for="pFirst"><input id="pFirst" type="checkbox">생애최초 구입</label>
      <label class="field check" for="pNewlywed"><input id="pNewlywed" type="checkbox">신혼(혼인 7년 이내)</label>
      <label class="field check" for="pBaby"><input id="pBaby" type="checkbox">2년 내 출산</label>
    </div>
    <div class="list" id="policyList"></div>
  </section>

  <footer id="footer">
    <p id="srcNote">화면 확인용 샘플 데이터입니다. 은행 이름과 상품 구성은 예시이며 금리·조건은 실제와 다릅니다.</p>
    <p>기준금리: 한국은행 경제통계시스템(ECOS). 예·적금·대출: 금융상품통합비교공시시스템(금융감독원) 금융회사 상품정보. 정책대출: 주택도시기금·한국주택금융공사 공고를 정리한 참고값으로, 실제 조건은 기관 공고를 확인하세요.</p>
  </footer>
</div>

function drawBase(){
  const svg=$("#baseChart"), W=520,H=96,pad={l:34,r:10,t:10,b:20};
  const ys=BASE_HISTORY.map(d=>d[1]), lo=Math.floor(Math.min(...ys)-0.5), hi=Math.ceil(Math.max(...ys)+0.5);
  const x=i=>pad.l+i*(W-pad.l-pad.r)/(BASE_HISTORY.length-1);
  const y=v=>pad.t+(hi-v)/(hi-lo)*(H-pad.t-pad.b);
  let d=`M${x(0)},${y(ys[0])}`;
  for(let i=1;i<ys.length;i++) d+=` H${x(i)} V${y(ys[i])}`;
  const area=d+` V${y(lo)} H${x(0)} Z`;
  const grid=[lo,(lo+hi)/2,hi].map(v=>`<line x1="${pad.l}" x2="${W-pad.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pad.l-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="var(--font-num)">${v.toFixed(1)}</text>`).join("");
  const n=BASE_HISTORY.length-1, idx=[...new Set([0,Math.round(n/3),Math.round(2*n/3),n])];
  const xl=idx.map(i=>`<text x="${x(i)}" y="${H-4}" text-anchor="${i===BASE_HISTORY.length-1?'end':'middle'}" font-size="10" fill="var(--muted)" font-family="var(--font-num)">${BASE_HISTORY[i][0].replace("-",".")}</text>`).join("");
  const last=BASE_HISTORY.length-1;
  svg.innerHTML=grid+`<path d="${area}" fill="var(--mark-soft)"/><path d="${d}" fill="none" stroke="var(--mark)" stroke-width="2" vector-effect="non-scaling-stroke"/><circle cx="${x(last)}" cy="${y(ys[last])}" r="4" fill="var(--mark)"/>`+xl;
  // 마지막 변경 시점
  let ch=last; while(ch>0 && BASE_HISTORY[ch-1][1]===BASE) ch--;
  const dir = ch>0 ? (BASE_HISTORY[ch-1][1]>BASE?"인하":"인상") : "변동 없이";
  const [yy,mm]=BASE_HISTORY[ch][0].split("-"); $("#baseInfo").textContent= ch>0 ? `${yy}년 ${+mm}월 ${dir} 후 동결 중` : "기간 내 변동 없음";
  $("#baseNow").textContent=pct(BASE);
}

function renderPolicy(){

/* ===== 실제 데이터 불러오기 (Vercel /api) ===== */
const num=v=>v===null||v===undefined||v===""?null:Number(v);
function toDepositLike(data){
  const map=new Map();
  data.baseList.forEach(b=>map.set(b.fin_prdt_cd+"|"+b.fin_co_no,{bank:b.fin_co_nm,name:b.fin_prdt_nm,rates:{},
    pref:String(b.spcl_cnd||"").split(/\n|(?=\d\.\s)/).map(x=>x.trim()),
    limit:b.max_limit?`월 ${fmt(b.max_limit/10000)}만원`:"납입한도 정보 없음", join:b.join_way}));
  data.optionList.forEach(o=>{
    const p=map.get(o.fin_prdt_cd+"|"+o.fin_co_no); if(!p) return;
    const t=Number(o.save_trm); if(![6,12,24].includes(t)) return;
    const basic=num(o.intr_rate), max=num(o.intr_rate2)??basic; if(basic===null&&max===null) return;
    const cur=p.rates[t];
    if(!cur||max>cur[1]) p.rates[t]=[basic??max,max];
  });
  return [...map.values()].filter(p=>Object.keys(p.rates).length);
}
function toLoans(data,kind){
  const map=new Map();
  data.baseList.forEach(b=>map.set(b.fin_prdt_cd+"|"+b.fin_co_no,{bank:b.fin_co_nm,name:b.fin_prdt_nm,mins:[],maxs:[],avgs:[],types:new Set()}));
  data.optionList.forEach(o=>{
    const p=map.get(o.fin_prdt_cd+"|"+o.fin_co_no); if(!p) return;
    if(kind==="credit"){
      if(o.crdt_lend_rate_type!=="A") return; // 대출금리 행만
      const g=["crdt_grad_1","crdt_grad_4","crdt_grad_5","crdt_grad_6","crdt_grad_10","crdt_grad_11","crdt_grad_12","crdt_grad_13"].map(k=>num(o[k])).filter(v=>v>0);
      if(g.length){p.mins.push(Math.min(...g));p.maxs.push(Math.max(...g));}
      if(num(o.crdt_grad_avg)>0) p.avgs.push(num(o.crdt_grad_avg));
      p.types.add(o.crdt_prdt_type_nm);
    }else{
      if(num(o.lend_rate_min)>0) p.mins.push(num(o.lend_rate_min));
      if(num(o.lend_rate_max)>0) p.maxs.push(num(o.lend_rate_max));
      if(num(o.lend_rate_avg)>0) p.avgs.push(num(o.lend_rate_avg));
      if(o.lend_rate_type_nm) p.types.add(o.lend_rate_type_nm);
    }
  });
  return [...map.values()].filter(p=>p.mins.length).map(p=>{
    const min=Math.min(...p.mins), max=Math.max(...p.maxs,min);
    const avg=p.avgs.length?p.avgs.reduce((a,b)=>a+b,0)/p.avgs.length:(min+max)/2;
    return {bank:p.bank,name:p.name,min,max,avg,type:[...p.types].join("·")||"-"};
  });
}
async function getJSON(u){const r=await fetch(u);if(!r.ok) throw new Error(u+" "+r.status);return r.json();}
async function loadLive(){
  if(!/^https?:/.test(location.protocol)) return;
  const results=await Promise.allSettled([
    getJSON("/api/base-rate"),
    getJSON("/api/finlife?type=deposit"),getJSON("/api/finlife?type=saving"),
    getJSON("/api/finlife?type=mortgage"),getJSON("/api/finlife?type=rent"),getJSON("/api/finlife?type=credit")
  ]);
  const [base,dep,sav,mort,rent,cred]=results.map(r=>r.status==="fulfilled"?r.value:null);
  let ok=0;
  if(base?.history?.length){BASE_HISTORY=base.history;BASE=BASE_HISTORY[BASE_HISTORY.length-1][1];ok++;}
  if(dep){DEPOSITS=toDepositLike(dep);ok++;}
  if(sav){SAVINGS=toDepositLike(sav);ok++;}
  if(mort){LOANS.mortgage=toLoans(mort,"mortgage");ok++;}
  if(rent){LOANS.jeonse=toLoans(rent,"rent");ok++;}
  if(cred){LOANS.credit=toLoans(cred,"credit");ok++;}
  if(!ok) return;

  if(ok===6){chip.textContent="실시간 공시 데이터";chip.style.background="var(--accent-soft)";chip.style.color="var(--accent)";
    $("#srcNote").textContent="예·적금·대출은 금융감독원 공시 기준(매월 갱신)이며, 은행 창구 금리와 다를 수 있어요.";}
  else{chip.textContent="일부만 실제 데이터";$("#srcNote").textContent="일부 데이터를 불러오지 못해 해당 탭은 샘플로 표시돼요.";}
  drawBase(); renderDeposit(); renderSavings(); renderLoan(); renderPolicy();
}
